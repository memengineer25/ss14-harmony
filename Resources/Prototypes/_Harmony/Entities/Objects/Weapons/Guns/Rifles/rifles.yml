- type: entity
  parent: [BaseWeaponRifle, BaseSyndicateContraband]
  id: WeaponRifleBandit
  name: Bandit
  description: A precise and reliable bullpup, engineered to perfection by Scarborough Arms. Uses .30 caseless rifle ammo.
  components:
  - type: Sprite
    sprite: _Harmony/Objects/Weapons/Guns/Rifles/bandit.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Harmony/Objects/Weapons/Guns/Rifles/bandit.rsi
  - type: Gun
    selectedMode: Burst
    availableModes:
    - Burst
    - SemiAuto
    fireRate: 2
    shotsPerBurst: 2
    burstFireRate: 50
    burstCooldown: 0.75
    soundGunshot:
      collection: DMRFire
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleCaseless
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifleCaseless
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleCaseless
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifleCaseless
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: [BaseWeaponRifle, BaseSyndicateContraband]
  id: WeaponRifleBrigand
  name: Brigand
  description: A brutally powerful but difficult to control battle rifle. Uses .30 caseless rifle ammo.
  components:
  - type: Sprite #placeholder m90gl sprites
    sprite: Objects/Weapons/Guns/Rifles/carbine.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/carbine.rsi
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: GunRequiresWield
  - type: Gun
    fireRate: 4.5
    minAngle: 6
    maxAngle: 40
    angleIncrease: 20
    angleDecay: 30
    availableModes:
      - FullAuto
    soundGunshot:
      collection: DMRFire
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleCaseless
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifleCaseless
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleCaseless
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifleCaseless
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
